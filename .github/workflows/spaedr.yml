name: SpaedrNG Build

# فایل مادر: به کدهای مخزن دست نمی‌زنه.
# تغییرها فقط روی کپی موقت انجام می‌شن و APK نهایی توی Releases میاد.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: '21'

    # ---------- ظاهر و هویت جدید SpaedrNG (فقط روی کپی موقت) ----------
    - name: Apply SpaedrNG brand
      shell: bash
      run: |
        set -e
        APP=V2rayNG/app
        RES=$APP/src/main/res
        mkdir -p $RES/drawable $RES/mipmap-anydpi-v26 $APP/src/main/java/com/v2ray/ang/ui

        cat > $RES/drawable/ic_spaedr_bg.xml <<'XML'
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0A0A0A" android:pathData="M0,0h108v108h-108z"/>
        </vector>
        XML

        cat > $RES/drawable/ic_spaedr_fg.xml <<'XML'
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#E11D2E"
                android:pathData="M46,62 a8,11 0 1,0 16,0 a8,11 0 1,0 -16,0 Z"/>
            <path android:fillColor="#E11D2E"
                android:pathData="M49,44 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0 Z"/>
            <path android:strokeColor="#E11D2E" android:strokeWidth="2.6"
                android:strokeLineCap="round" android:strokeLineJoin="round"
                android:pathData="M50,46 L40,34 L32,36 M48,50 L36,44 L26,50 M47,58 L35,60 L26,70 M49,66 L41,75 L36,80 M58,46 L68,34 L76,36 M60,50 L72,44 L82,50 M61,58 L73,60 L82,70 M59,66 L67,75 L72,80"/>
        </vector>
        XML

        for n in ic_launcher ic_launcher_round; do
        cat > $RES/mipmap-anydpi-v26/$n.xml <<'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_spaedr_bg"/>
            <foreground android:drawable="@drawable/ic_spaedr_fg"/>
        </adaptive-icon>
        XML
        done

        cat > $APP/src/main/java/com/v2ray/ang/ui/SpaedrIntroActivity.kt <<'KT'
        package com.v2ray.ang.ui

        import android.app.Activity
        import android.content.Intent
        import android.graphics.Color
        import android.graphics.Typeface
        import android.graphics.drawable.GradientDrawable
        import android.net.Uri
        import android.os.Bundle
        import android.view.Gravity
        import android.view.ViewGroup.LayoutParams.MATCH_PARENT
        import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
        import android.widget.LinearLayout
        import android.widget.TextView

        class SpaedrIntroActivity : Activity() {
            private val red = Color.parseColor("#E11D2E")

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                window.statusBarColor = Color.BLACK
                window.navigationBarColor = Color.BLACK
                val d = resources.displayMetrics.density

                val root = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    gravity = Gravity.CENTER
                    setBackgroundColor(Color.parseColor("#0A0A0A"))
                    setPadding((28 * d).toInt(), 0, (28 * d).toInt(), 0)
                }
                root.addView(TextView(this).apply {
                    text = "SpaedrNG"; textSize = 42f; setTextColor(red)
                    typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
                })
                root.addView(TextView(this).apply {
                    text = "این یک کلاینت قوی و پرسرعت است\nو به مرور زمان بهش چیز های بیشتری اضافه خواهد شد"
                    textSize = 16f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                    setPadding(0, (24 * d).toInt(), 0, (36 * d).toInt())
                })
                root.addView(TextView(this).apply {
                    text = "ورود به برنامه"; textSize = 17f; setTextColor(Color.WHITE)
                    typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
                    setPadding(0, (14 * d).toInt(), 0, (14 * d).toInt())
                    background = GradientDrawable().apply {
                        setColor(red); cornerRadius = 16 * d
                    }
                    setOnClickListener {
                        startActivity(Intent(this@SpaedrIntroActivity, MainActivity::class.java))
                        finish()
                    }
                }, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT))
                root.addView(TextView(this).apply {
                    text = "سازنده: @spaedrNG"; textSize = 14f
                    setTextColor(Color.parseColor("#9A9A9A")); gravity = Gravity.CENTER
                    setPadding(0, (28 * d).toInt(), 0, 0)
                    setOnClickListener {
                        startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://t.me/spaedrNG")))
                    }
                })
                setContentView(root)
            }
        }
        KT

        python3 - <<'PY'
        import re, pathlib
        root = pathlib.Path("V2rayNG/app")

        # 1) شناسه برنامه (کلون: کنار v2rayNG اصلی نصب می‌شه)
        g = root / "build.gradle.kts"
        s = g.read_text(encoding="utf-8")
        s2 = re.sub(r'(applicationId\s*=\s*")[^"]*(")', r'\1ir.spaedr.ng2026x\2', s)
        if s2 == s:
            print("---- lines with applicationId ----")
            for i, line in enumerate(s.splitlines(), 1):
                if "applicationId" in line or "namespace" in line:
                    print(i, line)
        assert s2 != s, "applicationId not found in build.gradle.kts (see lines above)"
        g.write_text(s2, encoding="utf-8")

        # 2) اسم برنامه
        n = 0
        for f in root.glob("src/main/res/values*/strings.xml"):
            t = f.read_text(encoding="utf-8")
            t2 = re.sub(r'(<string name="app_name"[^>]*>)[^<]*(</string>)', r'\1SpaedrNG\2', t)
            if "app_name" in t:
                f.write_text(t2, encoding="utf-8"); n += 1
        print("app_name files changed:", n)
        assert n > 0, "app_name not found"

        # 3) صفحه ورود قبل از صفحه اصلی
        m = root / "src/main/AndroidManifest.xml"
        t = m.read_text(encoding="utf-8")
        t = re.sub(r'\s*<category\s+android:name="android\.intent\.category\.LAUNCHER"\s*/>', '', t)
        act = """
            <activity
                android:name="com.v2ray.ang.ui.SpaedrIntroActivity"
                android:exported="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <intent-filter>
                    <action android:name="android.intent.action.MAIN" />
                    <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
            </activity>
        """
        assert "</application>" in t, "no </application> in manifest"
        t = t.replace("</application>", act + "</application>", 1)
        m.write_text(t, encoding="utf-8")
        print("manifest patched")
        PY

    - name: Create signing key
      run: |
        keytool -genkeypair -keystore $RUNNER_TEMP/spaedr.jks \
          -storepass spaedr123 -keypass spaedr123 -alias spaedr \
          -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SpaedrNG"

    - name: Build APK
      shell: bash
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport --console=plain > $RUNNER_TEMP/lic.log 2>&1 || true
        if ! ./gradlew assembleRelease --console=plain \
          -Pandroid.injected.signing.store.file=$RUNNER_TEMP/spaedr.jks \
          -Pandroid.injected.signing.store.password=spaedr123 \
          -Pandroid.injected.signing.key.alias=spaedr \
          -Pandroid.injected.signing.key.password=spaedr123 > $RUNNER_TEMP/build.log 2>&1; then
          echo "=========== ERRORS ==========="
          grep -n -E "^e: |error:|FAILED|What went wrong" -A 6 $RUNNER_TEMP/build.log | head -n 60
          exit 1
        fi

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      with:
        name: SpaedrNG-universal
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: spaedr-${{ github.run_number }}
        name: SpaedrNG ${{ github.run_number }}
        files: V2rayNG/app/build/outputs/apk/*/release/*universal*.apk