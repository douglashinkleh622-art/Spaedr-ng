name: SpaedrNG Build

# فایل مادر: به کدهای مخزن دست نمی‌زنه.
# تغییرها فقط روی کپی موقت انجام می‌شن و APK نهایی توی Releases میاد.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: '21'

    # ---------- ظاهر و هویت جدید SpaedrNG (فقط روی کپی موقت) ----------
    - name: Apply SpaedrNG brand
      shell: bash
      run: |
        set -e
        APP=V2rayNG/app
        RES=$APP/src/main/res
        mkdir -p $RES/drawable $RES/mipmap-anydpi-v26 $APP/src/main/java/com/v2ray/ang/ui

        cat > $RES/drawable/ic_spaedr_bg.xml <<'XML'
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0A0A0A" android:pathData="M0,0h108v108h-108z"/>
        </vector>
        XML

        cat > $RES/drawable/ic_spaedr_fg.xml <<'XML'
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#E11D2E"
                android:pathData="M46,62 a8,11 0 1,0 16,0 a8,11 0 1,0 -16,0 Z"/>
            <path android:fillColor="#E11D2E"
                android:pathData="M49,44 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0 Z"/>
            <path android:strokeColor="#E11D2E" android:strokeWidth="2.6"
                android:strokeLineCap="round" android:strokeLineJoin="round"
                android:pathData="M50,46 L40,34 L32,36 M48,50 L36,44 L26,50 M47,58 L35,60 L26,70 M49,66 L41,75 L36,80 M58,46 L68,34 L76,36 M60,50 L72,44 L82,50 M61,58 L73,60 L82,70 M59,66 L67,75 L72,80"/>
        </vector>
        XML

        for n in ic_launcher ic_launcher_round; do
        cat > $RES/mipmap-anydpi-v26/$n.xml <<'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_spaedr_bg"/>
            <foreground android:drawable="@drawable/ic_spaedr_fg"/>
        </adaptive-icon>
        XML
        done

        cat > $APP/src/main/java/com/v2ray/ang/ui/SpaedrUi.kt <<'KT'
        package com.v2ray.ang.ui

        import android.content.Context
        import android.graphics.Color
        import android.graphics.Typeface
        import android.graphics.drawable.GradientDrawable
        import android.view.Gravity
        import android.view.View
        import android.view.ViewGroup
        import android.widget.FrameLayout
        import android.widget.ImageView
        import android.widget.LinearLayout
        import android.widget.TextView
        import com.v2ray.ang.R

        object SpaedrUi {
            val RED: Int = Color.parseColor("#E11D2E")
            val DARK_RED: Int = Color.parseColor("#9E1020")

            fun dp(ctx: Context, v: Int): Int = (v * ctx.resources.displayMetrics.density).toInt()

            fun lp(w: Int, h: Int, top: Int = 0): LinearLayout.LayoutParams {
                val p = LinearLayout.LayoutParams(w, h)
                p.topMargin = top
                return p
            }

            fun page(ctx: Context): LinearLayout {
                val l = LinearLayout(ctx)
                l.orientation = LinearLayout.VERTICAL
                l.gravity = Gravity.CENTER
                l.background = GradientDrawable(
                    GradientDrawable.Orientation.TOP_BOTTOM,
                    intArrayOf(Color.parseColor("#0A0A0E"), Color.parseColor("#12060A"), Color.parseColor("#26080F"))
                )
                l.setPadding(dp(ctx, 30), dp(ctx, 24), dp(ctx, 30), dp(ctx, 24))
                return l
            }

            fun logo(ctx: Context, size: Int): FrameLayout {
                val box = FrameLayout(ctx)
                val glow = View(ctx)
                val g = GradientDrawable()
                g.shape = GradientDrawable.OVAL
                g.gradientType = GradientDrawable.RADIAL_GRADIENT
                g.gradientRadius = dp(ctx, size) * 0.9f
                g.setColors(intArrayOf(Color.parseColor("#55E11D2E"), Color.parseColor("#00E11D2E")))
                glow.background = g
                box.addView(glow, FrameLayout.LayoutParams(dp(ctx, size * 2), dp(ctx, size * 2), Gravity.CENTER))
                val img = ImageView(ctx)
                img.setImageResource(R.drawable.ic_spaedr_fg)
                box.addView(img, FrameLayout.LayoutParams(dp(ctx, size), dp(ctx, size), Gravity.CENTER))
                return box
            }

            fun title(ctx: Context, text: String, size: Float): TextView {
                val t = TextView(ctx)
                t.text = text
                t.textSize = size
                t.setTextColor(Color.WHITE)
                t.typeface = Typeface.DEFAULT_BOLD
                t.letterSpacing = 0.12f
                t.gravity = Gravity.CENTER
                return t
            }

            fun accent(ctx: Context): View {
                val v = View(ctx)
                val g = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(RED, DARK_RED))
                g.cornerRadius = dp(ctx, 2).toFloat()
                v.background = g
                return v
            }

            fun body(ctx: Context, text: String): TextView {
                val t = TextView(ctx)
                t.text = text
                t.textSize = 15f
                t.setTextColor(Color.parseColor("#B9B9C4"))
                t.gravity = Gravity.CENTER
                t.setLineSpacing(0f, 1.45f)
                return t
            }

            fun button(ctx: Context, text: String, onClick: () -> Unit): TextView {
                val b = TextView(ctx)
                b.text = text
                b.textSize = 16f
                b.setTextColor(Color.WHITE)
                b.typeface = Typeface.DEFAULT_BOLD
                b.gravity = Gravity.CENTER
                b.setPadding(0, dp(ctx, 16), 0, dp(ctx, 16))
                val g = GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, intArrayOf(RED, DARK_RED))
                g.cornerRadius = dp(ctx, 28).toFloat()
                b.background = g
                b.elevation = dp(ctx, 6).toFloat()
                b.setOnClickListener { onClick() }
                return b
            }

            fun footer(ctx: Context, text: String, onClick: () -> Unit): TextView {
                val t = TextView(ctx)
                t.text = text
                t.textSize = 13f
                t.setTextColor(Color.parseColor("#7C7C88"))
                t.gravity = Gravity.CENTER
                t.setPadding(0, dp(ctx, 28), 0, 0)
                t.setOnClickListener { onClick() }
                return t
            }

            fun fadeIn(root: ViewGroup) {
                for (i in 0 until root.childCount) {
                    val c = root.getChildAt(i)
                    c.alpha = 0f
                    c.translationY = dp(root.context, 22).toFloat()
                    c.animate().alpha(1f).translationY(0f).setStartDelay(110L * i).setDuration(450L).start()
                }
            }
        }
        KT

        cat > $APP/src/main/java/com/v2ray/ang/ui/SpaedrIntroActivity.kt <<'KT'
        package com.v2ray.ang.ui

        import android.app.Activity
        import android.content.Intent
        import android.graphics.Color
        import android.net.Uri
        import android.os.Bundle
        import android.view.ViewGroup.LayoutParams.MATCH_PARENT
        import android.view.ViewGroup.LayoutParams.WRAP_CONTENT

        class SpaedrIntroActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                window.statusBarColor = Color.parseColor("#0A0A0E")
                window.navigationBarColor = Color.parseColor("#26080F")
                val u = SpaedrUi
                val root = u.page(this)
                root.addView(u.logo(this, 120))
                root.addView(u.title(this, "SpaedrNG", 34f))
                root.addView(u.accent(this), u.lp(u.dp(this, 36), u.dp(this, 3), u.dp(this, 14)))
                root.addView(
                    u.body(this, "این یک کلاینت قوی و پرسرعت است\nو به مرور زمان بهش چیز های بیشتری اضافه خواهد شد"),
                    u.lp(MATCH_PARENT, WRAP_CONTENT, u.dp(this, 22))
                )
                root.addView(u.button(this, "ورود به برنامه") {
                    startActivity(Intent().setClassName(this@SpaedrIntroActivity, "__MAIN__"))
                    finish()
                }, u.lp(MATCH_PARENT, WRAP_CONTENT, u.dp(this, 38)))
                root.addView(u.footer(this, "@spaedrNG") {
                    startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://t.me/spaedrNG")))
                })
                setContentView(root)
                u.fadeIn(root)
            }
        }
        KT

        python3 - <<'PY'
        import re, pathlib
        root = pathlib.Path("V2rayNG/app")

        # 1) شناسه برنامه (کلون: کنار v2rayNG اصلی نصب می‌شه)
        g = root / "build.gradle.kts"
        s = g.read_text(encoding="utf-8")
        s2 = re.sub(r'(applicationId\s*=\s*")[^"]*(")', r'\1ir.spaedr.ng2026x\2', s)
        if s2 == s:
            print("---- lines with applicationId ----")
            for i, line in enumerate(s.splitlines(), 1):
                if "applicationId" in line or "namespace" in line:
                    print(i, line)
        assert s2 != s, "applicationId not found in build.gradle.kts (see lines above)"
        g.write_text(s2, encoding="utf-8")

        # 2) اسم برنامه: همه app_name های قدیمی حذف می‌شن و یکی جدید ساخته می‌شه
        n = 0
        for f in root.glob("src/main/res/values*/*.xml"):
            t = f.read_text(encoding="utf-8")
            t2, c = re.subn(r'<string\s+name="app_name"[^>]*>.*?</string>', '', t, flags=re.S)
            if c:
                f.write_text(t2, encoding="utf-8"); n += c
        print("old app_name entries removed:", n)
        for f in root.glob("src/main/res/values*/strings.xml"):
            t = f.read_text(encoding="utf-8")
            t2 = re.sub(r'(?<![/\w.])(?i:v2rayng)', 'SpaedrNG', t)
            if t2 != t:
                f.write_text(t2, encoding="utf-8")
        vdir = root / "src/main/res/values"
        vdir.mkdir(parents=True, exist_ok=True)
        (vdir / "spaedr_app_name.xml").write_text(
            '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
            '    <string name="app_name">SpaedrNG</string>\n</resources>\n', encoding="utf-8")

        # 3) صفحه ورود قبل از صفحه اصلی
        m = root / "src/main/AndroidManifest.xml"
        t = m.read_text(encoding="utf-8")
        lp = t.find("android.intent.category.LAUNCHER")
        assert lp >= 0, "launcher category not found in manifest"
        starts = [x.start() for x in re.finditer(r'<activity\s', t) if x.start() < lp]
        assert starts, "launcher activity not found"
        nm = re.search(r'android:name="([^"]+)"', t[starts[-1]:]).group(1)
        main_cls = ("com.v2ray.ang" + nm) if nm.startswith(".") else nm
        print("main activity:", main_cls)
        k = root / "src/main/java/com/v2ray/ang/ui/SpaedrIntroActivity.kt"
        k.write_text(k.read_text(encoding="utf-8").replace("__MAIN__", main_cls), encoding="utf-8")

        t = re.sub(r'\s*<category\s+android:name="android\.intent\.category\.LAUNCHER"\s*/>', '', t)
        act = """
            <activity
                android:name="com.v2ray.ang.ui.SpaedrIntroActivity"
                android:exported="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <intent-filter>
                    <action android:name="android.intent.action.MAIN" />
                    <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
            </activity>
        """
        assert "</application>" in t, "no </application> in manifest"
        t = t.replace("</application>", act + "</application>", 1)
        m.write_text(t, encoding="utf-8")
        print("manifest patched")

        # 4) صفحه درباره: فقط کانال تلگرام
        ABOUT = """package __PKG__

        import android.app.Activity
        import android.content.Intent
        import android.graphics.Color
        import android.net.Uri
        import android.os.Bundle
        import android.view.ViewGroup.LayoutParams.MATCH_PARENT
        import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
        import com.v2ray.ang.ui.SpaedrUi

        class AboutActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                window.statusBarColor = Color.parseColor("#0A0A0E")
                window.navigationBarColor = Color.parseColor("#26080F")
                val ver = try { packageManager.getPackageInfo(packageName, 0).versionName } catch (e: Exception) { "" }
                val u = SpaedrUi
                val root = u.page(this)
                root.addView(u.logo(this, 100))
                root.addView(u.title(this, "SpaedrNG", 30f))
                root.addView(u.accent(this), u.lp(u.dp(this, 36), u.dp(this, 3), u.dp(this, 14)))
                root.addView(u.body(this, "نسخه " + (ver ?: "")), u.lp(MATCH_PARENT, WRAP_CONTENT, u.dp(this, 16)))
                root.addView(u.button(this, "کانال تلگرام  @spaedrNG") {
                    startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://t.me/spaedrNG")))
                }, u.lp(MATCH_PARENT, WRAP_CONTENT, u.dp(this, 36)))
                setContentView(root)
                u.fadeIn(root)
            }
        }
        """
        af = list(root.glob("src/main/java/**/AboutActivity.kt"))
        if af:
            pk = re.search(r'^package\s+([\w.]+)', af[0].read_text(encoding="utf-8"), re.M).group(1)
            af[0].write_text(ABOUT.replace("__PKG__", pk), encoding="utf-8")
            print("about replaced:", af[0])
        else:
            print("WARNING: AboutActivity.kt not found")

        # 5) آیکون اعلان (بجای V): عنکبوت سفید
        res = root / "src/main/res"
        for f in list(res.rglob("ic_stat_name.*")):
            f.unlink()
        (res / "drawable").mkdir(parents=True, exist_ok=True)
        (res / "drawable/ic_stat_name.xml").write_text(
            '<vector xmlns:android="http://schemas.android.com/apk/res/android"'
            ' android:width="24dp" android:height="24dp"'
            ' android:viewportWidth="108" android:viewportHeight="108">'
            '<path android:fillColor="#FFFFFF" android:pathData="M46,62 a8,11 0 1,0 16,0 a8,11 0 1,0 -16,0 Z"/>'
            '<path android:fillColor="#FFFFFF" android:pathData="M49,44 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0 Z"/>'
            '<path android:strokeColor="#FFFFFF" android:strokeWidth="4" android:strokeLineCap="round"'
            ' android:strokeLineJoin="round" android:pathData="M50,46 L40,34 L32,36 M48,50 L36,44 L26,50'
            ' M47,58 L35,60 L26,70 M49,66 L41,75 L36,80 M58,46 L68,34 L76,36 M60,50 L72,44 L82,50'
            ' M61,58 L73,60 L82,70 M59,66 L67,75 L72,80"/></vector>', encoding="utf-8")

        # آیکون‌های دیگه‌ای که ممکنه V باشن (فقط لیست می‌کنیم)
        for f in sorted(res.rglob("*")):
            if f.is_file() and re.search(r'logo|v2ray|ic_v_|ic_v\.', f.name, re.I):
                print("CANDIDATE icon:", f.relative_to(root))

        # 6) رنگ‌ها: همه رنگ‌های پررنگ به قرمز تبدیل می‌شن
        import colorsys
        hexp = r'(#[0-9A-Fa-f]{8}|#[0-9A-Fa-f]{6})'
        pat = re.compile(r'(<(?:color|item)\s+name="([^"]+)"[^>]*>)' + hexp + r'(</(?:color|item)>)')
        def recolor(m):
            name, val = m.group(2), m.group(3)
            if re.search(r'ping|green|success', name, re.I):
                return m.group(0)
            h = val[1:]; a = ""
            if len(h) == 8:
                a, h = h[:2], h[2:]
            r, g, b = [int(h[i:i+2], 16) / 255 for i in (0, 2, 4)]
            hh, ss, vv = colorsys.rgb_to_hsv(r, g, b)
            if ss < 0.25 or vv < 0.2:
                return m.group(0)
            r2, g2, b2 = colorsys.hsv_to_rgb(354 / 360, max(ss, 0.75), vv)
            return m.group(1) + "#" + a + "%02X%02X%02X" % (round(r2*255), round(g2*255), round(b2*255)) + m.group(4)
        cn = 0
        for nm_ in ("colors.xml", "themes.xml", "styles.xml"):
            for f in root.glob("src/main/res/values*/" + nm_):
                t = f.read_text(encoding="utf-8")
                t2 = pat.sub(recolor, t)
                if t2 != t:
                    f.write_text(t2, encoding="utf-8"); cn += 1
        print("color files recolored:", cn)

        # 7) حذف کامل لوگوی V (همه آیکون‌ها و لوگوهای قدیمی)
        BGV = (res / "drawable/ic_spaedr_bg.xml").read_text(encoding="utf-8")
        FGV = (res / "drawable/ic_spaedr_fg.xml").read_text(encoding="utf-8")
        mip = set()
        for f in list(res.rglob("*")):
            if (f.is_file() and f.parent.name.startswith("mipmap")
                    and f.name.startswith("ic_launcher")):
                st_ = f.name.split(".")[0]
                if f.parent.name.startswith("mipmap-anydpi") and st_ in ("ic_launcher", "ic_launcher_round"):
                    continue
                mip.add(st_)
                f.unlink()
        (res / "mipmap-anydpi-v24").mkdir(parents=True, exist_ok=True)
        for n_ in ("ic_launcher", "ic_launcher_round"):
            (res / "mipmap-anydpi-v24" / (n_ + ".xml")).write_text(
                '<?xml version="1.0" encoding="utf-8"?>\n'
                '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">\n'
                '    <item android:drawable="@drawable/ic_spaedr_bg"/>\n'
                '    <item android:drawable="@drawable/ic_spaedr_fg"/>\n'
                '</layer-list>\n', encoding="utf-8")
        for st_ in mip:
            if st_ in ("ic_launcher", "ic_launcher_round"):
                continue
            (res / "mipmap-anydpi-v24" / (st_ + ".xml")).write_text(
                BGV if st_.endswith("background") else FGV, encoding="utf-8")
        stems = set()
        for f in res.rglob("*"):
            if (f.is_file() and f.parent.name.startswith("drawable")
                    and not f.name.startswith("ic_spaedr")
                    and re.search(r'logo|ic_launcher', f.name, re.I)):
                stems.add(f.name.split(".")[0])
        for st in stems:
            for f in list(res.rglob(st + ".*")):
                if f.parent.name.startswith("drawable"):
                    f.unlink()
            (res / "drawable" / (st + ".xml")).write_text(
                BGV if st.endswith("background") else FGV, encoding="utf-8")
        print("logo drawables replaced:", sorted(stems))
        PY

    - name: Create signing key
      run: |
        keytool -genkeypair -keystore $RUNNER_TEMP/spaedr.jks \
          -storepass spaedr123 -keypass spaedr123 -alias spaedr \
          -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SpaedrNG"

    - name: Build APK
      shell: bash
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport --console=plain > $RUNNER_TEMP/lic.log 2>&1 || true
        if ! ./gradlew assembleRelease --console=plain \
          -Pandroid.injected.signing.store.file=$RUNNER_TEMP/spaedr.jks \
          -Pandroid.injected.signing.store.password=spaedr123 \
          -Pandroid.injected.signing.key.alias=spaedr \
          -Pandroid.injected.signing.key.password=spaedr123 > $RUNNER_TEMP/build.log 2>&1; then
          echo "=========== ERRORS ==========="
          grep -n -E "^e: |error:|FAILED|What went wrong" -A 6 $RUNNER_TEMP/build.log | head -n 60
          exit 1
        fi

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      with:
        name: SpaedrNG-universal
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: spaedr-${{ github.run_number }}
        name: SpaedrNG ${{ github.run_number }}
        files: V2rayNG/app/build/outputs/apk/*/release/*universal*.apk