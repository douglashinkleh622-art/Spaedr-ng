name: SpaedrNG Build

# فایل مادر: به کدهای مخزن دست نمی‌زنه.
# تغییرها فقط روی کپی موقت انجام می‌شن و APK نهایی توی Releases میاد.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.2.0
      with:
        distribution: 'temurin'
        java-version: '21'

    # ---------- هویت جدید SpaedrNG (فقط روی کپی موقت) ----------
    - name: Apply SpaedrNG brand
      shell: bash
      run: |
        set -e
        APP=V2rayNG/app
        RES=$APP/src/main/res
        mkdir -p $RES/drawable $RES/mipmap-anydpi-v26 $APP/src/main/java/com/v2ray/ang/ui

        cat > $RES/drawable/ic_spaedr_bg.xml <<'XML'
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0A0A0A" android:pathData="M0,0h108v108h-108z"/>
        </vector>
        XML

        cat > $RES/drawable/ic_spaedr_fg.xml <<'XML'
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:strokeColor="#E11D2E" android:strokeWidth="10"
                android:strokeLineCap="round" android:strokeLineJoin="round"
                android:pathData="M70,40 C70,33 63,28 54,28 C45,28 37,32 37,40 C37,48 45,51 54,54 C63,57 71,60 71,68 C71,76 63,80 54,80 C45,80 37,76 37,68"/>
        </vector>
        XML

        for n in ic_launcher ic_launcher_round; do
        cat > $RES/mipmap-anydpi-v26/$n.xml <<'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_spaedr_bg"/>
            <foreground android:drawable="@drawable/ic_spaedr_fg"/>
        </adaptive-icon>
        XML
        done

        cat > $APP/src/main/java/com/v2ray/ang/ui/SpaedrHook.kt <<'KT'
        package com.v2ray.ang.ui

        import android.app.Activity
        import android.app.Application
        import android.content.ContentProvider
        import android.content.ContentValues
        import android.database.Cursor
        import android.graphics.Bitmap
        import android.graphics.Canvas
        import android.graphics.Color
        import android.net.Uri
        import android.os.Bundle
        import android.util.TypedValue
        import android.view.Gravity
        import android.view.View
        import android.view.ViewGroup
        import android.widget.FrameLayout

        class SpaedrHook : ContentProvider() {
            override fun onCreate(): Boolean {
                val app = context?.applicationContext as? Application
                app?.registerActivityLifecycleCallbacks(object : Application.ActivityLifecycleCallbacks {
                    override fun onActivityCreated(activity: Activity, savedInstanceState: Bundle?) {}
                    override fun onActivityStarted(activity: Activity) {}
                    override fun onActivityResumed(activity: Activity) {
                        if (activity.javaClass.name == "__MAIN__") schedule(activity)
                    }
                    override fun onActivityPaused(activity: Activity) {}
                    override fun onActivityStopped(activity: Activity) {}
                    override fun onActivitySaveInstanceState(activity: Activity, outState: Bundle) {}
                    override fun onActivityDestroyed(activity: Activity) {}
                })
                return true
            }

            private fun schedule(a: Activity) {
                a.window.decorView.postDelayed({
                    try {
                        if (!a.isFinishing) cover(a)
                    } catch (e: Throwable) {
                    }
                }, 600)
            }

            // دکمه منوی سه‌خط با رنگ نوار بالا پوشانده می‌شه و کلیک روش جواب نمی‌ده
            private fun cover(a: Activity) {
                val decor = a.window.decorView as ViewGroup
                if (decor.findViewWithTag<View>("spaedr_cover") != null) return
                val dm = a.resources.displayMetrics
                val d = dm.density
                val tv = TypedValue()
                val bar = if (a.theme.resolveAttribute(android.R.attr.actionBarSize, tv, true))
                    TypedValue.complexToDimensionPixelSize(tv.data, dm) else (56 * d).toInt()
                val sbId = a.resources.getIdentifier("status_bar_height", "dimen", "android")
                val top = if (sbId > 0) a.resources.getDimensionPixelSize(sbId) else 0
                val w = (72 * d).toInt()
                val rtl = a.resources.configuration.layoutDirection == View.LAYOUT_DIRECTION_RTL

                var color = Color.parseColor("#0A0A0A")
                if (a.theme.resolveAttribute(android.R.attr.colorPrimary, tv, true)) {
                    color = Color.rgb(Color.red(tv.data), Color.green(tv.data), Color.blue(tv.data))
                }
                if (decor.width > 0 && decor.height > 0) {
                    val bmp = Bitmap.createBitmap(decor.width, decor.height, Bitmap.Config.ARGB_8888)
                    decor.draw(Canvas(bmp))
                    val sx = if (rtl) decor.width - w / 2 else w / 2
                    val sy = top + (4 * d).toInt()
                    val px = bmp.getPixel(sx.coerceIn(0, bmp.width - 1), sy.coerceIn(0, bmp.height - 1))
                    if (Color.alpha(px) > 200) color = Color.rgb(Color.red(px), Color.green(px), Color.blue(px))
                    bmp.recycle()
                }

                val v = View(a)
                v.tag = "spaedr_cover"
                v.setBackgroundColor(color)
                v.isClickable = true
                v.isFocusable = true
                v.elevation = 40 * d
                val lp = FrameLayout.LayoutParams(w, bar, Gravity.TOP or (if (rtl) Gravity.END else Gravity.START))
                lp.topMargin = top
                decor.addView(v, lp)
            }

            override fun query(uri: Uri, projection: Array<String>?, selection: String?, selectionArgs: Array<String>?, sortOrder: String?): Cursor? = null
            override fun getType(uri: Uri): String? = null
            override fun insert(uri: Uri, values: ContentValues?): Uri? = null
            override fun delete(uri: Uri, selection: String?, selectionArgs: Array<String>?): Int = 0
            override fun update(uri: Uri, values: ContentValues?, selection: String?, selectionArgs: Array<String>?): Int = 0
        }
        KT

        python3 - <<'PY'
        import re, pathlib
        root = pathlib.Path("V2rayNG/app")
        res = root / "src/main/res"

        APP_NAME = "SpaedrNG"      # اسم برنامه
        APP_VERSION = "V1"         # نسخه برنامه
        TG = "https://t.me/spaedrNG"

        # 1) شناسه برنامه (کلون: کنار v2rayNG اصلی نصب می‌شه) و نسخه
        g = root / "build.gradle.kts"
        s = g.read_text(encoding="utf-8")
        s2 = re.sub(r'(applicationId\s*=\s*")[^"]*(")', r'\1ir.spaedr.ng2026x\2', s)
        if s2 == s:
            print("---- lines with applicationId ----")
            for i, line in enumerate(s.splitlines(), 1):
                if "applicationId" in line or "namespace" in line:
                    print(i, line)
        assert s2 != s, "applicationId not found in build.gradle.kts (see lines above)"
        s3 = re.sub(r'(versionName\s*=\s*")[^"]*(")', r'\1' + APP_VERSION + r'\2', s2)
        if s3 == s2:
            print("WARNING: versionName not found")
        g.write_text(s3, encoding="utf-8")

        # 2) اسم برنامه: همه app_name های قدیمی حذف می‌شن و یکی جدید ساخته می‌شه
        n = 0
        for f in root.glob("src/main/res/values*/*.xml"):
            t = f.read_text(encoding="utf-8")
            t2, c = re.subn(r'<string\s+name="app_name"[^>]*>.*?</string>', '', t, flags=re.S)
            if c:
                f.write_text(t2, encoding="utf-8"); n += c
        print("old app_name entries removed:", n)
        for f in root.glob("src/main/res/values*/strings.xml"):
            t = f.read_text(encoding="utf-8")
            t2 = re.sub(r'(?<![/\w.])(?i:v2rayng)', APP_NAME, t)
            if t2 != t:
                f.write_text(t2, encoding="utf-8")
        vdir = root / "src/main/res/values"
        vdir.mkdir(parents=True, exist_ok=True)
        (vdir / "spaedr_app_name.xml").write_text(
            '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
            '    <string name="app_name">' + APP_NAME + '</string>\n</resources>\n', encoding="utf-8")

        # 3) آیکون اعلان (بجای V): حرف S سفید
        for f in list(res.rglob("ic_stat_name.*")):
            f.unlink()
        (res / "drawable").mkdir(parents=True, exist_ok=True)
        (res / "drawable/ic_stat_name.xml").write_text(
            '<vector xmlns:android="http://schemas.android.com/apk/res/android"'
            ' android:width="24dp" android:height="24dp"'
            ' android:viewportWidth="108" android:viewportHeight="108">'
            '<path android:strokeColor="#FFFFFF" android:strokeWidth="11" android:strokeLineCap="round"'
            ' android:strokeLineJoin="round" android:pathData="M70,40 C70,33 63,28 54,28 C45,28 37,32 37,40'
            ' C37,48 45,51 54,54 C63,57 71,60 71,68 C71,76 63,80 54,80 C45,80 37,76 37,68"/></vector>',
            encoding="utf-8")

        # 4) حذف کامل لوگوی V (همه آیکون‌ها و لوگوهای قدیمی) و جایگزینی با S
        BGV = (res / "drawable/ic_spaedr_bg.xml").read_text(encoding="utf-8")
        FGV = (res / "drawable/ic_spaedr_fg.xml").read_text(encoding="utf-8")
        mip = set()
        for f in list(res.rglob("*")):
            if (f.is_file() and f.parent.name.startswith("mipmap")
                    and f.name.startswith("ic_launcher")):
                st_ = f.name.split(".")[0]
                if f.parent.name.startswith("mipmap-anydpi") and st_ in ("ic_launcher", "ic_launcher_round"):
                    continue
                mip.add(st_)
                f.unlink()
        (res / "mipmap-anydpi-v24").mkdir(parents=True, exist_ok=True)
        for n_ in ("ic_launcher", "ic_launcher_round"):
            (res / "mipmap-anydpi-v24" / (n_ + ".xml")).write_text(
                '<?xml version="1.0" encoding="utf-8"?>\n'
                '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">\n'
                '    <item android:drawable="@drawable/ic_spaedr_bg"/>\n'
                '    <item android:drawable="@drawable/ic_spaedr_fg"/>\n'
                '</layer-list>\n', encoding="utf-8")
        for st_ in mip:
            if st_ in ("ic_launcher", "ic_launcher_round"):
                continue
            (res / "mipmap-anydpi-v24" / (st_ + ".xml")).write_text(
                BGV if st_.endswith("background") else FGV, encoding="utf-8")
        stems = set()
        for f in res.rglob("*"):
            if (f.is_file() and f.parent.name.startswith("drawable")
                    and not f.name.startswith("ic_spaedr")
                    and re.search(r'logo|ic_launcher', f.name, re.I)):
                stems.add(f.name.split(".")[0])
        for st in stems:
            for f in list(res.rglob(st + ".*")):
                if f.parent.name.startswith("drawable"):
                    f.unlink()
            (res / "drawable" / (st + ".xml")).write_text(
                BGV if st.endswith("background") else FGV, encoding="utf-8")
        print("logo drawables replaced:", sorted(stems))
        for f in sorted(res.rglob("*")):
            if f.is_file() and re.search(r'logo|v2ray|ic_v_|ic_v\.', f.name, re.I):
                print("CANDIDATE icon:", f.relative_to(root))

        # 5) همه لینک‌های v2rayNG و گیت‌هاب سازنده اصلی به کانال تو تبدیل می‌شن
        url_pat = re.compile(r"""https?://[^\s"'<>)\]]*(?:2dust|v2rayn)[^\s"'<>)\]]*""", re.I)
        cnt = 0
        for f in (root / "src/main").rglob("*"):
            if not f.is_file() or f.suffix.lower() not in (".kt", ".java", ".xml", ".html", ".json", ".txt", ".md"):
                continue
            if f.name == "spaedr_app_name.xml":
                continue
            try:
                t = f.read_text(encoding="utf-8")
            except Exception:
                continue
            hits = url_pat.findall(t)
            if hits:
                f.write_text(url_pat.sub(TG, t), encoding="utf-8")
                cnt += len(hits)
                print("link replaced:", f.relative_to(root), len(hits))
        print("total links replaced:", cnt)

        # 6) حذف بخش‌های برند و تبلیغات v2rayNG از منوها (مخفی می‌شن، شناسه‌ها می‌مونن تا کد خراب نشه)
        hide_pat = re.compile(r'promotion|promote|privacy|feedback|about|donat|sponsor|advert|source_?code|check_?update|menu_item_update', re.I)
        item_pat = re.compile(r'<item\b[^>]*>')
        hidden = 0
        for f in res.glob("menu*/*.xml"):
            t = f.read_text(encoding="utf-8")
            def hide(m):
                global hidden
                tag = m.group(0)
                if not hide_pat.search(tag):
                    return tag
                tag = re.sub(r'\s+android:visible="[^"]*"', '', tag)
                hidden += 1
                print("menu item hidden:", f.name, re.sub(r'\s+', ' ', tag)[:90])
                return tag[:-2] + ' android:visible="false"/>' if tag.endswith("/>") else tag[:-1] + ' android:visible="false">'
            t2 = item_pat.sub(hide, t)
            if t2 != t:
                f.write_text(t2, encoding="utf-8")
        print("menu items hidden:", hidden)

        # 7) پوشاندن دکمه منوی سه‌خط با رنگ نوار بالا (کلیک روش کار نمی‌کنه)
        mf = root / "src/main/AndroidManifest.xml"
        mt = mf.read_text(encoding="utf-8")
        lpos = mt.find("android.intent.category.LAUNCHER")
        assert lpos >= 0, "launcher category not found in manifest"
        starts = [x.start() for x in re.finditer(r'<activity\s', mt) if x.start() < lpos]
        assert starts, "launcher activity not found"
        nm = re.search(r'android:name="([^"]+)"', mt[starts[-1]:]).group(1)
        main_cls = ("com.v2ray.ang" + nm) if nm.startswith(".") else nm
        print("main activity:", main_cls)
        hk = root / "src/main/java/com/v2ray/ang/ui/SpaedrHook.kt"
        hk.write_text(hk.read_text(encoding="utf-8").replace("__MAIN__", main_cls), encoding="utf-8")
        prov = (
            '    <provider android:name="com.v2ray.ang.ui.SpaedrHook"'
            ' android:authorities="${applicationId}.spaedrhook" android:exported="false" />\n'
        )
        assert "</application>" in mt, "no </application> in manifest"
        mf.write_text(mt.replace("</application>", prov + "</application>", 1), encoding="utf-8")
        print("menu cover installed")
        PY

    - name: Create signing key
      run: |
        keytool -genkeypair -keystore $RUNNER_TEMP/spaedr.jks \
          -storepass spaedr123 -keypass spaedr123 -alias spaedr \
          -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SpaedrNG"

    - name: Build APK
      shell: bash
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport --console=plain > $RUNNER_TEMP/lic.log 2>&1 || true
        if ! ./gradlew assembleRelease --console=plain \
          -Pandroid.injected.signing.store.file=$RUNNER_TEMP/spaedr.jks \
          -Pandroid.injected.signing.store.password=spaedr123 \
          -Pandroid.injected.signing.key.alias=spaedr \
          -Pandroid.injected.signing.key.password=spaedr123 > $RUNNER_TEMP/build.log 2>&1; then
          echo "=========== ERRORS ==========="
          grep -n -E "^e: |error:|FAILED|What went wrong" -A 6 $RUNNER_TEMP/build.log | head -n 60
          exit 1
        fi

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      with:
        name: SpaedrNG-universal
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: spaedr-${{ github.run_number }}
        name: SpaedrNG ${{ github.run_number }}
        files: V2rayNG/app/build/outputs/apk/*/release/*universal*.apk
